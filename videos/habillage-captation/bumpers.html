<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bumpers d'intro</title>
<style>
@font-face{font-family:"EB Garamond";src:url(assets/fonts/eb-garamond-latin-wght-normal.woff2) format("woff2");font-weight:400 800;font-style:normal;font-display:block}
@font-face{font-family:"EB Garamond";src:url(assets/fonts/eb-garamond-latin-wght-italic.woff2) format("woff2");font-weight:400 800;font-style:italic;font-display:block}
@font-face{font-family:"Azeret Mono";src:url(assets/fonts/azeret-mono-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:block}

:root{
  --blue:#3D43CE;--orange:#FE4D1B;--cream:#F9F4EC;--ink:#393636;--night:#09122E;
  --page:#F9F4EC;--text:#393636;--muted:#6f6a66;--line:#e2d9cb;--accent:#3D43CE;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#09122E;--text:#F2ECE2;--muted:#a7a9bd;--line:#232c52;--accent:#8f93ff}
}
:root[data-theme="dark"]{--page:#09122E;--text:#F2ECE2;--muted:#a7a9bd;--line:#232c52;--accent:#8f93ff}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--text);font:16px/1.55 Arial,Helvetica,sans-serif}
.wrap{max-width:1480px;margin:0 auto;padding:0 max(16px,3vw)}
.lb{font-family:Arial,Helvetica,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.12em}

.masthead{padding:56px 0 28px;border-bottom:1px solid var(--line)}
.masthead .kicker{font-size:12px;color:var(--accent)}
.masthead h1{font-family:"EB Garamond",serif;font-weight:600;font-size:clamp(40px,6vw,76px);line-height:1;margin:14px 0 18px;letter-spacing:-.01em}
.masthead h1 em{font-style:italic;color:var(--orange)}
.masthead p{max-width:860px;margin:0 0 10px}
.masthead .facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:20px;font-size:11px;color:var(--muted)}
.masthead .switch{display:inline-block;margin-top:22px;padding:10px 18px;border-radius:999px;background:var(--blue);color:#F9F4EC;text-decoration:none;font-size:12px;box-shadow:4px 4px 0 var(--orange)}
.masthead .switch:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--orange)}
.slot{padding:44px 0 4px}
.slot h2{display:flex;align-items:baseline;gap:16px;margin:0 0 18px;font-family:"EB Garamond",serif;font-weight:600;font-size:34px}
.slot h2 .lb{font-size:11px;color:var(--muted)}
.cards{display:grid;gap:28px 24px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.cards{grid-template-columns:1fr}}
.card h3{margin:12px 0 2px;font-family:"EB Garamond",serif;font-size:21px;font-weight:600;line-height:1.2}
.card p{margin:0;font-size:11px;color:var(--muted)}
.fr{display:block}
footer{margin:64px 0 0;padding:24px 0 48px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

/* Frame: a fixed 1920x1080 canvas scaled to the card width */
.fr{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:#09122E;box-shadow:0 1px 0 var(--line),0 10px 30px rgba(9,18,46,.14)}
.cv{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:left top;overflow:hidden;color:var(--cream);background:var(--night);font-family:Arial,Helvetica,sans-serif}
.cv *{box-sizing:border-box}
.abs{position:absolute}
.full{position:absolute;inset:0}
.serif{font-family:"EB Garamond",serif}
.wm{font-family:"EB Garamond",serif;font-weight:400;letter-spacing:.02em;white-space:nowrap}
.wm b{font-weight:700}.wm i{font-style:italic}
.mark{display:inline-block;fill:currentColor}
.grain::after{content:"";position:absolute;inset:0;background:url(assets/img/grain.png);mix-blend-mode:overlay;opacity:.22;pointer-events:none}

/* Solo mode (?session=slug): the frame alone, native size, for OBS */
body.solo{background:#09122E;overflow:hidden}
body.solo .cv{position:relative;transform:none}
/* Key mode (&key=1): vMix overlay PNG, camera and slides become alpha holes, stand-in footage goes */
html.key,body.solo.key{background:transparent}
.key .talk .footage,.key .talk .camtag,.key .talk .slide>*{display:none}

/* Poster in two passes: the session art, then an orange copy of its darks printed off register */
.poster{position:absolute;overflow:hidden;background:var(--cream);isolation:isolate}
.poster img{position:absolute;max-width:none}
.poster img.pass2{mix-blend-mode:multiply;opacity:.3;filter:grayscale(1) contrast(1.5) brightness(1.1) sepia(1) saturate(9) hue-rotate(-28deg);transform:translate(9px,6px)}

/* Ink portrait: normalised crop, greyscale lightened by the track ink, second ink off register */
.inkp{position:relative;flex:none;overflow:hidden;border-radius:50%;background:var(--cream);isolation:isolate;box-shadow:0 0 0 5px var(--cream)}
.inkp .pl{position:absolute;inset:0;mix-blend-mode:multiply;isolation:isolate}
/* Same zoom for every norm crop, small enough that the tallest hair stays inside the disc */
.inkp .pl img{width:100%;height:100%;object-fit:cover;transform:scale(1.1);transform-origin:50% 44%;filter:grayscale(1) contrast(1.2) brightness(1.08)}
.inkp .pl::after{content:"";position:absolute;inset:0;background:var(--k);mix-blend-mode:lighten}
.inkp .pl.o{transform:translate(5px,3px);opacity:.42}
.inkp .pl.o::after{background:var(--k2)}

.chip{display:inline-flex;align-items:center;padding:9px 16px 8px;border-radius:999px;font:700 19px Arial,Helvetica,sans-serif;text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}
.t-decide{--k:#3D43CE;--k2:#FE4D1B;--relief:#FE4D1B}
.t-impl{--k:#3D43CE;--k2:#FE4D1B;--relief:#FE4D1B}
.t-common{--k:#3D43CE;--k2:#FE4D1B;--relief:#FE4D1B}
.t-decide .chip{background:var(--blue);color:var(--cream)}
.t-impl .chip{background:var(--orange);color:var(--cream)}
.t-common .chip{background:var(--cream);color:var(--night)}

/* Text column */
.col{position:absolute;top:170px;bottom:150px;display:flex;flex-direction:column;justify-content:center}
.meta{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.meta .lb{font-size:20px}
.title{font-family:"EB Garamond",serif;font-weight:600;line-height:.99;letter-spacing:-.01em;margin:34px 0 0;text-shadow:.04em .04em 0 var(--relief);text-wrap:balance}
.lay-A .col,.lay-A .foot{text-shadow:0 2px 18px rgba(9,18,46,.7)}
.lay-A .title{text-shadow:.04em .04em 0 var(--relief),0 4px 34px rgba(9,18,46,.6)}
.lay-A.paper .col,.lay-A.paper .foot{text-shadow:none;color:var(--night)}
.lay-A.paper .title{text-shadow:.04em .04em 0 var(--relief)}
.lay-A.paper .tba .seat{border-color:rgba(9,18,46,.45)}
.lay-A.paper .inkp{box-shadow:0 0 0 5px var(--night)}
.foot{position:absolute;bottom:72px;font-size:16px;opacity:.78}

/* Speakers */
.spk{margin-top:56px}
.solo-spk{display:flex;align-items:center;gap:30px}
.solo-spk .name{font-family:"EB Garamond",serif;font-size:54px;font-weight:600;line-height:1}
.solo-spk .role{font-size:18px;line-height:1.5;margin-top:12px;opacity:.88}
.list-spk{display:flex;flex-direction:column;gap:20px}
.list-spk .row{display:flex;align-items:center;gap:24px}
.list-spk .name{font-family:"EB Garamond",serif;font-size:38px;font-weight:600;line-height:1}
.list-spk .role{font-size:14px;line-height:1.45;margin-top:8px;opacity:.88}
.grid-spk{display:grid;gap:18px}
.grid-spk .cell{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.grid-spk .name{font-family:"EB Garamond",serif;font-size:27px;font-weight:600;line-height:1.02;margin-top:20px}
.grid-spk .role{font-size:12px;line-height:1.45;margin-top:8px;opacity:.85}
.grid-spk .tag{display:inline-block;margin-top:10px;padding:4px 9px 3px;border-radius:999px;font-size:11px;background:rgba(249,244,236,.14)}
.tba{display:flex;align-items:center;gap:30px}
.tba .seat{flex:none;width:150px;height:150px;border-radius:50%;border:3px dashed rgba(249,244,236,.55);display:grid;place-items:center}
.tba .seat svg{width:60px;height:60px;color:var(--k)}
.t-impl .tba .seat svg{color:var(--orange)}
.t-decide .tba .seat svg,.t-common .tba .seat svg{color:#7d82ff}
.tba .name{font-family:"EB Garamond",serif;font-size:48px;font-weight:500;font-style:italic;line-height:1}
.tba .role{font-size:16px;margin-top:14px;opacity:.75}
.host{display:flex;align-items:center;gap:30px}
.host img{height:76px}
.host .role{font-size:18px;opacity:.88;line-height:1.5}

/* In-talk frames (?view=talks), same look as the board's "Slides et intervenant" and "Tables rondes et jury" */
.talk .relief{text-shadow:.04em .04em 0 var(--orange)}
.talk .poster{background:var(--night)}
.talk .chip{font-size:15px;padding:8px 14px 7px}
.talk .footage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 60% 70% at 50% 30%,#55565c 0%,#2b2c31 55%,#17171a 100%)}
.talk .footage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#1d1d21,#121214)}
.talk .footage .who{position:absolute;bottom:0;height:96%;aspect-ratio:1/1;left:50%;transform:translateX(-50%);object-fit:cover;filter:grayscale(1) brightness(.55) contrast(.95);-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent),linear-gradient(transparent,#000 17%,#000 82%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent),linear-gradient(transparent,#000 17%,#000 82%,transparent);mask-composite:intersect}
.talk .cam{position:absolute;overflow:hidden;background:#17171a}
.talk .camtag{position:absolute;right:14px;top:12px;font:500 15px "Azeret Mono",monospace;letter-spacing:.1em;color:rgba(255,255,255,.45)}
.talk .camtag::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:#e33;margin-right:8px;vertical-align:0}
.talk .slide{position:absolute;aspect-ratio:16/9;background:#fff;color:#2c2c30;overflow:hidden}
.talk .slide .sl-t{position:absolute;left:7%;top:10%;width:58%;height:7%;background:#3b3b42;border-radius:4px}
.talk .slide .sl-l{position:absolute;left:7%;height:3.2%;background:#c9c9cf;border-radius:3px}
.talk .slide .sl-c{position:absolute;right:7%;top:30%;width:34%;height:52%;border:3px solid #d5d5da;border-radius:6px;background:repeating-linear-gradient(90deg,transparent 0 18%,#e6e6ea 18% 20%)}
.talk .slide .sl-c i{position:absolute;bottom:0;width:12%;background:#9a9aa3}
.talk .slide .sl-n{position:absolute;right:3%;bottom:4%;font:500 15px "Azeret Mono",monospace;color:#9a9aa3;letter-spacing:.1em}
.talk .filet .rule{width:110px;height:6px;background:var(--orange);margin-bottom:22px}
.talk .filet .name{font-family:"EB Garamond",serif;font-weight:600;line-height:1;text-shadow:.04em .04em 0 var(--orange)}
.talk .filet .name.tbd{font-weight:500;font-style:italic}
.talk .filet .role{font:700 17px/1.45 Arial,Helvetica,sans-serif;text-transform:uppercase;letter-spacing:.12em;margin-top:14px;opacity:.9}
.talk .filet .host-strap{display:flex;align-items:center;gap:28px}
.talk .filet .host-strap img{height:64px}
.talk .filet .host-strap .role{margin-top:0}
.talk .bug{position:absolute;left:64px;top:56px;display:flex;align-items:center;gap:16px;opacity:.72;color:var(--cream);z-index:50}
.talk .bug svg{width:38px;height:38px;fill:currentColor}
.talk .bug .wm{font-size:34px}
.talk .bug .lb{font-size:13px;opacity:.85;margin-left:4px}

/* Startup Contest: poster pushed right, its black wing extended under the text */
.contest .col{left:110px;width:900px}
.contest .glabel{display:flex;align-items:center;gap:16px;font-size:18px;margin:0 0 20px}
.contest .glabel::before{content:"";width:56px;height:5px;background:var(--orange)}
.contest .people{display:grid;gap:16px;width:1000px;margin-left:-20px}
.contest .people .cell{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.contest .people .name{font-family:"EB Garamond",serif;font-weight:600;line-height:1.02;margin-top:16px;white-space:nowrap}
.contest .people .co{font-size:14px;line-height:1.4;margin-top:8px;opacity:.9;text-wrap:balance}
.contest .host-line{font-size:17px;opacity:.9}
.contest .host-line b{font-family:"EB Garamond",serif;font-size:30px;font-weight:600;letter-spacing:0;text-transform:none;margin:0 10px}
.contest .company{display:flex;align-items:center;gap:40px;margin-top:40px}
.contest .company .logo{flex:none;width:150px;height:150px;border-radius:30px;overflow:hidden;display:grid;place-items:center}
.contest .company .logo.tile{background:var(--cream)}
.contest .company .logo.tile img{width:76%;height:76%;object-fit:contain}
.contest .company .logo img{width:100%;height:100%;object-fit:contain}
.contest .company .cname{font-family:"EB Garamond",serif;font-weight:700;font-size:168px;line-height:.9;letter-spacing:-.01em;text-shadow:.04em .04em 0 var(--orange)}
.contest .pitcher{display:flex;align-items:center;gap:30px;margin-top:64px}
.contest .pitcher .name{font-family:"EB Garamond",serif;font-size:58px;font-weight:600;line-height:1}
.contest .pitcher .role{font-size:19px;line-height:1.5;margin-top:12px;opacity:.9}
.contest .steps{position:absolute;left:110px;bottom:72px;display:flex;gap:30px;font-size:17px}
.contest .steps span{opacity:.45}
.contest .steps span.on{opacity:1;color:var(--cream)}
.contest .steps span.on::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--orange);margin-right:10px;vertical-align:1px}
.contest .jury{display:grid;grid-template-columns:repeat(2,1fr);gap:40px 36px;margin-top:52px;width:990px}
.contest .jury .row{display:flex;align-items:center;gap:22px;min-width:0}
.contest .jury .name{font-family:"EB Garamond",serif;font-size:38px;font-weight:600;line-height:1;white-space:nowrap}
.contest .jury .role{font-size:14px;line-height:1.5;margin-top:10px;opacity:.9;text-wrap:balance}
</style>
</head>

function speakersMarkup(s, colWidth) {
  if (s.host) return `<div class="spk host">${hostLogo(s)}<div class="role lb">Enregistré en public<br>pendant l'apéro</div></div>`;

  // Past five people the grid wraps onto two rows, so every cell keeps a readable width
  const cols = people.length > 5 ? Math.ceil(people.length / 2) : people.length;

}

// Place the art so its focus point lands at targetX, without ever uncovering the frame
// Trim cuts the printed paper margin some posters carry.
function artPlacement(s, boxW, boxH, targetX, fx = s.fx) {
  const [iw, ih] = ART_SIZES[s.art], trim = ART_TRIMS[s.art] || 0;
  const cw = iw * (1 - 2 * trim), ch = ih * (1 - 2 * trim);
  const scale = Math.max(boxW / cw, boxH / ch);
  const visibleLeft = Math.min(0, Math.max(boxW - cw * scale, targetX - fx * cw * scale));
  const left = visibleLeft - iw * trim * scale, top = (boxH - ch * scale) / 2 - ih * trim * scale;
  return `left:${left.toFixed(0)}px;top:${top.toFixed(0)}px;width:${(iw * scale).toFixed(0)}px;height:${(ih * scale).toFixed(0)}px`;
}

function frameMarkup(s) {

    <div class="foot lb" style="left:${colX}px">${foot}</div>

}

// Shrink the title until the column fits between the corner signature and the footer
// In-talk frames: the title box must end above the live camera
function fitTitles(root) {
  root.querySelectorAll(".cv").forEach(cv => {
    const col = cv.querySelector(".col"), title = cv.querySelector(".title");
    if (col && title) {
      // Restart from the authored size: the first pass runs before the web fonts load and may have shrunk it.
      let size = +(title.dataset.size ||= parseFloat(title.style.fontSize));
      title.style.fontSize = size + "px";
      while (col.scrollHeight > col.clientHeight + 1 && size > 56) {
        size -= 2;
        title.style.fontSize = size + "px";
      }
    }
    const box = cv.querySelector(".tk-box");
    if (box) {
      const boxTitle = box.querySelector(".tk-title");
      let size = +(boxTitle.dataset.size ||= parseFloat(boxTitle.style.fontSize));
      boxTitle.style.fontSize = size + "px";
      while (box.offsetTop + box.offsetHeight > TALK_CAM_TOP - 24 && size > 30) {
        size -= 2;
        boxTitle.style.fontSize = size + "px";
      }
    }
  });
}

// One frame per session; 3+ people get the round-table slide; the contest has one frame per pitch then the jury. part is 1-based.
function talkFrames(s) {
  if (s.contest) {
    const finalists = byTag(s, "Finaliste");
    return finalists.map((p, i) => ({part: i + 1, caption: `Pitch ${i + 1}/${finalists.length} · ${p.company}`, markup: pitchFrame(s, p, i, finalists.length)}))
      .concat({part: finalists.length + 1, caption: "Jury", markup: juryFrame(s)});
  }
  if (s.speakers.length < 3) return [{part: 1, caption: "Slides et intervenant", markup: slidesFrame(s)}];
  return [{part: 1, caption: "Table ronde", markup: panelFrame(s)}];
}

    frames: s => [{part: 1, caption: TRACK_LABEL[s.track], markup: s.contest ? contestBumper(s) : frameMarkup(s)}],
  },
  talks: {
    title: "Slides et intervenant", heading: "Slides et <em>intervenant</em>", other: "bumpers", switchLabel: "&larr; Bumpers d'intro",
    intro: "Le cadre pendant chaque session&nbsp;: l'affiche recadrée dans la bande de gauche, la caméra live et les slides figurées, le nom sous les slides. Les tables rondes ont leur vue à la place des slides&nbsp;: l'affiche, le titre et les intervenant·es. Le Startup Contest a un cadre par pitch, puis le jury. Cliquer un cadre l'ouvre seul, en 1920 × 1080, pour OBS.",
    frames: talkFrames,
  },
};
const cardId = (view, s, part) => view === "talks" ? `talk-${s.slug}${part > 1 ? `-${part}` : ""}` : s.slug;
// Anchors the board links to (bumpers.html?view=talks#tables-rondes): the first slot holding that kind of session
const SLOT_ANCHORS = [["tables-rondes", s => s.format === "Table ronde"], ["startup-contest", s => s.contest]];
const anchorPrefix = "";
const listingHref = view => view === "talks" ? "?view=talks" : "bumpers.html";
const soloHref = (view, s, part) => view === "talks" ? `?view=talks&session=${s.slug}${part > 1 ? `&part=${part}` : ""}` : `?session=${s.slug}`;

function renderListing(root, view) {
  const v = VIEWS[view];
  root.querySelector(".masthead h1").innerHTML = v.heading;
  root.querySelector(".masthead .intro").innerHTML = v.intro;
  const link = root.querySelector(".masthead .switch");
  link.href = listingHref(v.other);
  link.innerHTML = v.switchLabel;
  const slotTimes = [...new Set(SESSIONS.map(s => s.time))];
  const anchors = view === "talks" ? Object.fromEntries(SLOT_ANCHORS.map(([id, test]) => [SESSIONS.find(test).time, anchorPrefix + id])) : {};
  root.querySelector(".slots").innerHTML = slotTimes.map(time => {
    const cards = SESSIONS.filter(s => s.time === time).flatMap(s => v.frames(s).map(f => `<article class="card" id="${cardId(view, s, f.part)}">
  <a class="fr" href="${soloHref(view, s, f.part)}">${f.markup}</a>
  <h3>${s.title}</h3><p class="lb">${s.time} · ${f.caption}</p></article>`));
    return `<section class="slot"${anchors[time] ? ` id="${anchors[time]}"` : ""}><h2>${time}</h2><div class="cards">${cards.join("")}</div></section>`;
  }).join("");
}

function fitFrames() {
  document.querySelectorAll(".fr").forEach(frame => {
    const canvas = frame.querySelector(".cv");
    if (canvas) canvas.style.transform = `scale(${frame.clientWidth / W})`;
  });
}

// Key mode: the camera and slides boxes become fully transparent holes, snapped to whole pixels
// so vMix inputs can sit under them; the cream camera border is a box-shadow outside the hole, so it stays.
// The holes are written to data-holes ("name x y w h;...") for the exporter.
function punchKeyHoles(canvas) {
  document.documentElement.classList.add("key");
  document.body.classList.add("key");
  if (!canvas.classList.contains("talk")) return;
  const holes = [["camera", ".cam"], ["slides", ".slide"]].map(([name, sel]) => {
    const el = canvas.querySelector(sel);
    if (!el) return null;
    const r = el.getBoundingClientRect(), x = Math.round(r.left), y = Math.round(r.top);
    return {name, x, y, w: Math.round(r.right) - x, h: Math.round(r.bottom) - y};
  }).filter(Boolean);
  canvas.dataset.holes = holes.map(h => `${h.name} ${h.x} ${h.y} ${h.w} ${h.h}`).join(";");
  if (holes.length) canvas.style.clipPath = `path(evenodd,"M0 0H${W}V${H}H0Z${holes.map(h => `M${h.x} ${h.y}h${h.w}v${h.h}h${-h.w}Z`).join("")}")`;
}

const params = new URLSearchParams(location.search);
const view = params.get("view") === "talks" ? "talks" : "bumpers";
const soloSession = SESSIONS.find(s => s.slug === params.get("session"));
document.title = VIEWS[view].title;
if (soloSession) {
  const frames = VIEWS[view].frames(soloSession);
  document.body.classList.add("solo");
  document.getElementById("board").outerHTML = (frames.find(f => f.part === +params.get("part")) || frames[0]).markup;
  if (params.get("key") === "1") punchKeyHoles(document.querySelector(".cv"));
} else {
  renderListing(document.getElementById("board"), view);
  fitFrames();
  new ResizeObserver(fitFrames).observe(document.body);
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}
fitTitles(document);
document.fonts.ready.then(() => fitTitles(document));
</script>
